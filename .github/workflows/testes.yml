# CI: corre todos os testes (pytest) em cada envio, para qualquer ramo, e em cada PR.
# Os testes usam dados inventados, por isso não precisam dos dados do Portal BASE.
name: testes

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          # A chave da cache muda se mudar qualquer uma das duas listas (o requirements-cpu.txt inclui o requirements.txt).
          cache-dependency-path: |
            requirements.txt
            requirements-cpu.txt

      # torch só para processador (E5-T2): o CI não tem GPU e a versão para GPU pesa ~2 GB.
      - name: Instalar bibliotecas
        run: pip install -r requirements-cpu.txt

      # Portão de qualidade (E4-T5): o campeão do main, para o teste comparar com o do ramo.
      # Só se o main ainda não tiver o ficheiro é que a comparação salta; outro erro do git falha.
      - name: Campeão do main
        run: |
          git fetch --depth=1 origin main
          if git cat-file -e origin/main:metrics/validacao.json 2>/dev/null; then
            git show origin/main:metrics/validacao.json > "$RUNNER_TEMP/validacao_main.json"
            echo "VALIDACAO_MAIN=$RUNNER_TEMP/validacao_main.json" >> "$GITHUB_ENV"
          fi

      - name: Correr os testes
        run: pytest -v
