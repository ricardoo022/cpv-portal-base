# CI: corre todos os testes (pytest) em cada envio, para qualquer ramo, e em cada PR.
# Os testes usam dados inventados, por isso não precisam dos dados do Portal BASE.
name: testes

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Instalar bibliotecas
        run: pip install -r requirements.txt

      # Portão de qualidade (E4-T5): o campeão do main, para o teste comparar com o do ramo.
      # Se o main ainda não tiver o ficheiro, não se escreve nada e essa comparação salta.
      - name: Campeão do main
        run: |
          git fetch --depth=1 origin main
          git show origin/main:metrics/validacao.json > "$RUNNER_TEMP/validacao_main.json" \
            || rm -f "$RUNNER_TEMP/validacao_main.json"
          echo "VALIDACAO_MAIN=$RUNNER_TEMP/validacao_main.json" >> "$GITHUB_ENV"

      - name: Correr os testes
        run: pytest -v
